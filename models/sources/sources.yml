version: 2

sources:
  - name: raw_data
    description: Raw payment system data from Airbyte ingestion
    database: prd-dagen
    schema: payments_v1
    tables:
      - name: customers
        description: Raw customer records with duplicates and test data
        columns:
          - name: customer_id
            description: Unique customer identifier
            data_type: STRING
            tests:
              - not_null
          - name: customer_type
            description: Type of customer (e.g., individual, business, samet=test)
            data_type: STRING
          - name: email
            description: Customer email address
            data_type: STRING
          - name: phone_number
            description: Customer phone number
            data_type: STRING
          - name: kyc_status
            description: KYC verification status (ok, done, yes, pending, rejected)
            data_type: STRING
          - name: address
            description: Customer address
            data_type: STRING
          - name: risk_profile
            description: Customer risk assessment
            data_type: STRING
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP
          - name: updated_at
            description: Record last update timestamp
            data_type: TIMESTAMP

      - name: transactions
        description: Raw transaction records
        columns:
          - name: transaction_id
            description: Unique transaction identifier
            data_type: STRING
            tests:
              - not_null
          - name: debtor_customer_id
            description: Customer ID of the payer
            data_type: STRING
          - name: creditor_customer_id
            description: Customer ID of the payee
            data_type: STRING
          - name: payment_method_id
            description: Payment method used
            data_type: STRING
          - name: amount
            description: Transaction amount
            data_type: NUMERIC
          - name: currency
            description: Transaction currency code
            data_type: STRING
          - name: status
            description: Transaction status (pending, completed, failed, cancelled)
            data_type: STRING
          - name: reference
            description: Transaction reference number
            data_type: STRING
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP
          - name: updated_at
            description: Record last update timestamp
            data_type: TIMESTAMP

      - name: payment_methods
        description: Raw payment method records
        columns:
          - name: payment_method_id
            description: Unique payment method identifier
            data_type: STRING
            tests:
              - not_null
          - name: customer_id
            description: Customer who owns this payment method
            data_type: STRING
          - name: method_type
            description: Type of payment method (credit_card, debit_card, bank_account, etc.)
            data_type: STRING
          - name: is_default
            description: Whether this is the default payment method
            data_type: BOOLEAN
          - name: details
            description: Additional payment method details
            data_type: STRING
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP
          - name: updated_at
            description: Record last update timestamp
            data_type: TIMESTAMP

      - name: transaction_legs
        description: Double-entry accounting ledger entries (CRITICAL - currently broken with 17K+ legs per transaction)
        columns:
          - name: leg_id
            description: Unique ledger entry identifier
            data_type: STRING
          - name: transaction_id
            description: Transaction this leg belongs to
            data_type: STRING
            tests:
              - not_null
          - name: direction
            description: Ledger entry direction (debit or credit)
            data_type: STRING
          - name: amount
            description: Amount for this ledger entry
            data_type: NUMERIC
          - name: currency
            description: Currency code
            data_type: STRING
          - name: account
            description: Account identifier
            data_type: STRING
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP

      - name: refunds
        description: Raw refund records
        columns:
          - name: refund_id
            description: Unique refund identifier
            data_type: STRING
            tests:
              - not_null
          - name: original_transaction_id
            description: Transaction being refunded
            data_type: STRING
          - name: amount
            description: Refund amount
            data_type: NUMERIC
          - name: currency
            description: Currency code
            data_type: STRING
          - name: reason
            description: Reason for refund
            data_type: STRING
          - name: status
            description: Refund status
            data_type: STRING
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP
          - name: updated_at
            description: Record last update timestamp
            data_type: TIMESTAMP

      - name: disputes
        description: Raw dispute records
        columns:
          - name: dispute_id
            description: Unique dispute identifier
            data_type: STRING
            tests:
              - not_null
          - name: transaction_id
            description: Transaction being disputed
            data_type: STRING
          - name: amount
            description: Dispute amount
            data_type: NUMERIC
          - name: currency
            description: Currency code
            data_type: STRING
          - name: reason
            description: Reason for dispute
            data_type: STRING
          - name: status
            description: Dispute status (open, resolved, lost, won)
            data_type: STRING
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP
          - name: updated_at
            description: Record last update timestamp
            data_type: TIMESTAMP

      - name: fees
        description: Raw fee records
        columns:
          - name: fee_id
            description: Unique fee identifier
            data_type: STRING
            tests:
              - not_null
          - name: transaction_id
            description: Transaction this fee is associated with
            data_type: STRING
          - name: amount
            description: Fee amount
            data_type: NUMERIC
          - name: currency
            description: Currency code
            data_type: STRING
          - name: fee_type
            description: Type of fee
            data_type: STRING
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP

      - name: mandates
        description: Raw mandate records
        columns:
          - name: mandate_id
            description: Unique mandate identifier
            data_type: STRING
            tests:
              - not_null
          - name: customer_id
            description: Customer this mandate belongs to
            data_type: STRING
          - name: payment_method_id
            description: Payment method for this mandate
            data_type: STRING
          - name: reference
            description: Mandate reference
            data_type: STRING
          - name: status
            description: Mandate status (active, inactive, cancelled)
            data_type: STRING
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP
          - name: updated_at
            description: Record last update timestamp
            data_type: TIMESTAMP

      - name: payouts
        description: Raw payout records
        columns:
          - name: payout_id
            description: Unique payout identifier
            data_type: STRING
            tests:
              - not_null
          - name: recipient_customer_id
            description: Customer receiving the payout
            data_type: STRING
          - name: amount
            description: Payout amount
            data_type: NUMERIC
          - name: currency
            description: Currency code
            data_type: STRING
          - name: status
            description: Payout status (pending, completed, failed, cancelled)
            data_type: STRING
          - name: scheduled_at
            description: When the payout was scheduled
            data_type: TIMESTAMP
          - name: executed_at
            description: When the payout was executed
            data_type: TIMESTAMP
          - name: created_at
            description: Record creation timestamp
            data_type: TIMESTAMP