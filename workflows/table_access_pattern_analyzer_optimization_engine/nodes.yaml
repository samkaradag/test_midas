- node_id: agent_07569bd0
  node_type: agent
  label: PII Detection & Validation
  description: Validates that analyzed tables contain no unencrypted PII and ensures
    compliance
  position:
    x: 1240.0
    y: 334.0
  config: {}
  agent_id: super_agent
  agent_instructions: 'Scan the analyzed tables for any Personally Identifiable Information
    (PII) and ensure compliance:\n\nCheck for common PII patterns:\n1. EMAIL ADDRESSES:
    Columns containing @domain patterns\n2. PHONE NUMBERS: 10-digit or international
    formats\n3. SOCIAL SECURITY NUMBERS: 9-digit patterns (XXX-XX-XXXX)\n4. CREDIT
    CARD NUMBERS: 16-digit patterns\n5. NAMES: First/last name columns with personal
    identifiers\n6. ADDRESSES: Street, city, postal codes\n7. DATE OF BIRTH: Birth
    date columns\n8. PASSPORT/ID NUMBERS: Government ID patterns\n9. ENCRYPTED/HASHED
    DATA: Verify if sensitive data is properly encrypted\n10. COLUMN NAMING PATTERNS:
    Review column names for PII indicators\n\nFor each table analyzed:\n- Flag any
    columns that appear to contain PII\n- Check data classification and encryption
    status\n- Verify compliance with data privacy regulations (GDPR, CCPA, HIPAA)\n-
    Recommend data masking or encryption if needed\n\nOutput:\n- List of tables with
    NO PII detected (safe to optimize)\n- List of tables WITH PII detected (require
    additional safeguards)\n- Recommendations for PII handling during optimization\n-
    Compliance status and risk assessment\n\nIf PII is detected, flag as HIGH PRIORITY
    for data governance review before proceeding with optimizations.'
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 15
  retry_count: 0
- node_id: agent_40cef3cf
  node_type: agent
  label: Analyze Table Access Patterns
  description: Super agent analyzes table access patterns from database metrics
  position:
    x: 680.0
    y: 227.0
  config: {}
  agent_id: super_agent
  agent_instructions: "Analyze table access patterns from the database query logs\
    \ and metrics. \n\nFor each table, identify:\n1. Query frequency (number of queries\
    \ accessing the table)\n2. Most common filter columns (WHERE clause analysis)\n\
    3. Most frequently joined columns\n4. Average query execution time\n5. Total data\
    \ scanned\n6. Peak access hours/patterns\n\nFocus on the top 10 most accessed\
    \ tables. Output a detailed JSON report with table names, access frequency, and\
    \ key access patterns."
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 15
  retry_count: 0
