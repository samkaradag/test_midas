- node_id: agent_22edd08a
  node_type: agent
  label: Rollback & Restore Previous State
  description: Controlled rollback mechanism to restore previous stable state when
    auto-recovery fails. Preserves forensics data for root cause analysis.
  position:
    x: 10200.0
    y: 120.0
  config: {}
  agent_id: dbt_agent
  agent_instructions: "Execute controlled rollback to restore previous stable state:\n\
    \n**ROLLBACK SEQUENCE:**\n1. **Identify Last Good State:**\n   - Locate previous\
    \ successful workflow run with quality_score >= 95\n   - Verify rollback target\
    \ has all required data (no gaps)\n\n2. **Snapshot Current State (for forensics):**\n\
    \   - Export current problematic data to gs://backup/failed_run_{timestamp}/\n\
    \   - Preserve dbt run logs and quality reports for investigation\n   - Document\
    \ anomalies that triggered rollback\n\n3. **Restore BigQuery Tables:**\n   - Revert\
    \ fact tables to last good snapshot\n   - Revert marts to last good snapshot\n\
    \   - Keep staging/dimensions as-is (source of truth from ingestion)\n   - Validate\
    \ table row counts match expected baseline\n\n4. **Verify Rollback:**\n   - Run\
    \ data quality checks on restored tables\n   - Confirm quality_score >= 95 on\
    \ rolled-back data\n   - Validate no data loss for critical tables\n\n5. **Notify\
    \ & Document:**\n   - Send CRITICAL alert: \"Rollback executed - investigate root\
    \ cause\"\n   - Log rollback reason, timestamp, and restored state\n   - Create\
    \ incident ticket for manual review\n\n6. **Mark Workflow State:**\n   - Set workflow\
    \ status to 'ROLLED_BACK'\n   - Prevent automatic retry until manual approval\n\
    \   - Flag for engineering team review\n\nReturn: {rollback_status: 'success'|'failed',\
    \ tables_restored, quality_verified, alert_sent}"
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 15
  retry_count: 0
