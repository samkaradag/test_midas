- node_id: agent_c0ba3f6c
  node_type: agent
  label: Schema Evolution Handler & Auto-Fix
  description: Detects schema evolution issues from source, validates against dbt
    models, and auto-fixes or escalates to Slack
  position:
    x: 1800.0
    y: 227.0
  config: {}
  agent_id: dbt_agent
  agent_instructions: "Advanced schema evolution detection and auto-remediation system:\n\
    \n**SCHEMA EVOLUTION DETECTION PHASE:**\n1. **Source Schema Analysis:**\n   -\
    \ Compare current PostgreSQL payments_v1 schema against last known state\n   -\
    \ Detect: new columns, dropped columns, type changes, constraint changes\n   -\
    \ Identify: column renames, reordering, default value changes\n\n2. **Airbyte\
    \ Connector Validation:**\n   - Check Airbyte connector configuration against\
    \ source schema\n   - Validate field mappings are up-to-date\n   - Detect: unmapped\
    \ new columns, broken mappings\n\n3. **BigQuery Schema Validation:**\n   - Compare\
    \ BigQuery table schemas against source\n   - Detect schema drift in destination\n\
    \   - Identify: missing columns, type mismatches\n\n4. **dbt Model Alignment:**\n\
    \   - Validate dbt models reference existing columns\n   - Check for broken column\
    \ references in staging layer\n   - Identify: orphaned columns in transformations\n\
    \n**AUTO-REMEDIATION STRATEGIES:**\n\n**TIER 1 - SAFE AUTO-FIX (Execute Immediately):**\n\
    1. **Additive Changes (New Columns):**\n   - Auto-add new columns to staging models\
    \ (stg_* tables)\n   - Set appropriate data types based on source\n   - Add null\
    \ handling if column is optional\n   - Auto-generate dbt documentation for new\
    \ columns\n\n2. **Column Renames:**\n   - Update dbt models with new column names\n\
    \   - Maintain backward compatibility with aliases\n   - Update downstream fact/mart\
    \ references\n\n3. **Type Coercion (Safe):**\n   - Auto-cast compatible types\
    \ (int\u2192bigint, varchar\u2192string)\n   - Add explicit type casting in dbt\
    \ models\n   - Log type changes for audit trail\n\n**TIER 2 - VALIDATION REQUIRED\
    \ (Notify & Wait):**\n1. **Destructive Changes (Dropped Columns):**\n   - Flag\
    \ columns being dropped from source\n   - Check if columns used in downstream\
    \ models\n   - If used: require manual approval before removal\n   - If unused:\
    \ auto-remove from dbt models\n\n2. **Type Incompatibilities:**\n   - Flag incompatible\
    \ type changes (string\u2192int without safe conversion)\n   - Suggest conversion\
    \ functions\n   - Require manual validation\n\n**TIER 3 - ESCALATION (Slack Alert\
    \ Required):**\n1. **Breaking Changes:**\n   - Primary key changes\n   - Unique\
    \ constraint removals\n   - Critical column drops\n   - Major type incompatibilities\n\
    \n2. **Complex Scenarios:**\n   - Multiple simultaneous schema changes\n   - Changes\
    \ affecting multiple tables\n   - Ambiguous column renames\n\n**EXECUTION FLOW:**\n\
    1. Execute all TIER 1 auto-fixes\n2. For TIER 2: notify #data-pipeline Slack channel,\
    \ wait for approval (timeout: 30 min)\n3. For TIER 3: immediately escalate to\
    \ #data-incidents with detailed analysis\n\n**SLACK NOTIFICATIONS:**\n- **AUTO-FIX\
    \ SUCCESS:** \"\u2705 Schema Evolution Auto-Fixed: Added 3 new columns to transactions\
    \ table. Updated dbt staging models. Quality check: PASSED\"\n- **MANUAL APPROVAL\
    \ NEEDED:** \"\u26A0\uFE0F Schema Change Requires Approval: Dropped column 'legacy_field'\
    \ detected. Used in 2 downstream models. Approve removal? [Yes/No]\"\n- **CRITICAL\
    \ ESCALATION:** \"\U0001F6A8 CRITICAL Schema Evolution Issue: Primary key change\
    \ detected in customers table. Manual intervention required. <link to full analysis>\"\
    \n\n**ROLLBACK CAPABILITY:**\n- Create snapshot of dbt models before changes\n\
    - Maintain schema change history in metadata table\n- Enable rollback to previous\
    \ schema version if needed\n\n**AUDIT & DOCUMENTATION:**\n- Log all schema changes\
    \ to schema_evolution_log table\n- Document auto-fixes applied and their impact\n\
    - Generate schema change report for data governance team\n\nReturn: {schema_changes_detected,\
    \ auto_fixes_applied, manual_approvals_needed, critical_issues, slack_notifications_sent,\
    \ quality_check_passed}"
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 15
  retry_count: 0
