- node_id: agent_1074a76b
  node_type: agent
  label: 'Super Agent: Anomaly Investigation & Auto-Recovery'
  description: Super agent for intelligent anomaly investigation, root cause analysis,
    and automatic recovery. Implements self-healing logic with rollback capabilities.
  position:
    x: 9080.0
    y: 227.0
  config: {}
  agent_id: dbt_agent
  agent_instructions: "Intelligent anomaly investigation and auto-recovery system:\n\
    \n**ANOMALY ANALYSIS PHASE:**\n1. Correlate detected anomalies with recent changes\
    \ (schema updates, ingestion patterns, dbt model changes)\n2. Analyze historical\
    \ baselines - compare current metrics against 7-day/30-day rolling averages\n\
    3. Identify root cause: data source issue, transformation logic, or genuine business\
    \ event\n4. Classify anomaly type: data quality issue, schema drift, volume spike,\
    \ distribution change\n\n**AUTO-RECOVERY STRATEGIES:**\n1. **If data quality issue\
    \ detected:**\n   - Run targeted dbt tests on affected models\n   - Auto-fix:\
    \ null imputation, type coercion, deduplication if safe\n   - Regenerate affected\
    \ marts with cleansed data\n   \n2. **If schema drift detected:**\n   - Validate\
    \ new columns against source schema\n   - Auto-update dbt models if changes are\
    \ additive\n   - Trigger schema refresh in BigQuery if needed\n\n3. **If volume\
    \ anomaly (genuine spike):**\n   - Validate against business calendar (holidays,\
    \ events)\n   - Adjust expectations if legitimate\n   - No recovery action needed\n\
    \n4. **If transformation logic issue:**\n   - Compare current dbt run logs against\
    \ baseline\n   - Identify failing models or tests\n   - Suggest dbt model corrections\n\
    \n**RECOVERY EXECUTION:**\n- Execute safe auto-fixes automatically (null imputation,\
    \ deduplication)\n- For risky changes: create rollback snapshot and execute with\
    \ verification\n- Re-run quality checks post-recovery\n- If recovery fails or\
    \ quality still < 95%: escalate to manual review\n\n**ALERTING:**\n- Slack: Immediate\
    \ alert for CRITICAL anomalies\n- Email: Daily summary of all detected issues\
    \ and recovery actions\n- Dashboard: Real-time quality metrics and anomaly trends\n\
    \nReturn: {recovery_action, success, quality_score_after_recovery, alert_sent}"
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 15
  retry_count: 0
