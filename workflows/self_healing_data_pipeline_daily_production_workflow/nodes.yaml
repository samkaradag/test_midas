- node_id: agent_51007eea
  node_type: agent
  label: 'Super Agent: PII Data Governance & Compliance Check'
  description: ''
  position:
    x: 7400.0
    y: 248.0
  config: {}
  agent_id: data_insights_agent
  agent_instructions: "Advanced PII detection, data governance, and compliance validation\
    \ system:\n\n**PII DETECTION & CLASSIFICATION PHASE:**\n\n1. **Sensitive Field\
    \ Identification:**\n   - Email addresses (pattern: *@*.*)\n   - Phone numbers\
    \ (pattern: +1-XXX-XXX-XXXX or variations)\n   - Social Security Numbers (pattern:\
    \ XXX-XX-XXXX)\n   - Credit card numbers (pattern: 4111-XXXX-XXXX-XXXX, etc.)\n\
    \   - Bank account numbers (pattern: routing + account)\n   - Passport/ID numbers\n\
    \   - Date of birth (correlate with age calculations)\n   - Full names (especially\
    \ in combination with other PII)\n   - IP addresses (IPv4/IPv6 patterns)\n   -\
    \ Tax IDs and national identifiers\n   - Driver license numbers\n   - Biometric\
    \ data (fingerprints, facial recognition)\n\n2. **Column-Level Analysis:**\n \
    \  - Scan all columns in staging, dimensions, and facts tables\n   - Classify\
    \ each column: PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED\n   - Identify composite\
    \ PII (name + DOB = high risk)\n   - Flag unexpected PII in non-PII columns\n\n\
    3. **Data Pattern Matching:**\n   - Use regex patterns for common PII formats\n\
    \   - Analyze column names for PII hints (email, phone, ssn, etc.)\n   - Check\
    \ data type mismatches (string fields with numeric PII)\n   - Detect encoded/hashed\
    \ PII (MD5, SHA1, SHA256 patterns)\n\n**GOVERNANCE VALIDATION:**\n\n1. **Access\
    \ Control Verification:**\n   - Confirm PII columns have restricted BigQuery access\n\
    \   - Validate IAM roles limit PII access to authorized users only\n   - Check\
    \ for overly permissive dataset/table permissions\n   - Verify service accounts\
    \ have minimal necessary access\n\n2. **Encryption Status Check:**\n   - Verify\
    \ PII columns use BigQuery column-level encryption\n   - Check encryption keys\
    \ are rotated regularly\n   - Validate encryption at rest and in transit\n   -\
    \ Flag any unencrypted PII columns\n\n3. **Data Masking & Redaction:**\n   - Verify\
    \ PII is masked/redacted in non-production environments\n   - Check for proper\
    \ tokenization of sensitive values\n   - Validate hashing algorithms (bcrypt,\
    \ scrypt, Argon2)\n   - Ensure masking is applied consistently across all PII\
    \ columns\n\n4. **Retention Policy Compliance:**\n   - Verify PII retention policies\
    \ are documented\n   - Check deletion/archival schedules are enforced\n   - Validate\
    \ GDPR/CCPA compliance (right to be forgotten)\n   - Monitor for PII data older\
    \ than retention threshold\n\n**COMPLIANCE CHECKS:**\n\n1. **Regulatory Compliance:**\n\
    \   - GDPR: Verify consent tracking and right to erasure mechanisms\n   - CCPA:\
    \ Check California resident data is properly flagged\n   - HIPAA: Validate PHI\
    \ (Protected Health Information) handling if applicable\n   - PCI-DSS: Confirm\
    \ payment card data handling compliance\n   - SOC 2: Verify audit logging and\
    \ access controls\n\n2. **Data Lineage & Audit Trail:**\n   - Track PII from source\
    \ \u2192 staging \u2192 dimensions \u2192 facts\n   - Log all PII access and transformations\n\
    \   - Maintain audit trail for compliance investigations\n   - Document data flow\
    \ for DPA (Data Processing Agreement) purposes\n\n3. **Third-Party Data Sharing:**\n\
    \   - Identify which PII columns are shared with external systems\n   - Verify\
    \ data sharing agreements are in place\n   - Check consent flags before sharing\
    \ customer data\n   - Validate anonymization before external sharing\n\n**ANOMALY\
    \ DETECTION FOR PII:**\n\n1. **Unexpected PII Exposure:**\n   - Alert if PII appears\
    \ in unexpected tables/columns\n   - Flag if unencrypted PII is detected\n   -\
    \ Detect new PII sources not previously documented\n   - Identify PII appearing\
    \ in logs or error messages\n\n2. **Access Anomalies:**\n   - Monitor for unusual\
    \ access patterns to PII columns\n   - Alert on bulk data exports of PII\n   -\
    \ Flag access from unexpected IP ranges\n   - Track access outside normal business\
    \ hours\n\n3. **Data Quality Issues with PII:**\n   - Check for null rates in\
    \ critical PII fields\n   - Detect duplicate customer records (identity fraud\
    \ risk)\n   - Identify mismatched PII (email format errors, invalid phone numbers)\n\
    \   - Flag suspicious value distributions (all same SSN, etc.)\n\n**REMEDIATION\
    \ & ENFORCEMENT:**\n\n1. **Auto-Fix Actions (Safe):**\n   - Add encryption to\
    \ unencrypted PII columns\n   - Apply standard masking patterns to exposed PII\n\
    \   - Update IAM policies to restrict access\n   - Enable column-level security\
    \ policies\n\n2. **Manual Review Required:**\n   - Unexpected PII in non-standard\
    \ locations\n   - Complex compliance violations\n   - Potential data breaches\
    \ or unauthorized exposure\n   - Cross-regulatory compliance conflicts\n\n3. **Escalation\
    \ Triggers:**\n   - CRITICAL: Unencrypted PII in production\n   - CRITICAL: Unauthorized\
    \ access detected\n   - CRITICAL: PII in logs or error messages\n   - HIGH: Retention\
    \ policy violations\n   - HIGH: Missing access controls\n   - MEDIUM: Data quality\
    \ issues with PII\n\n**REPORTING & ALERTS:**\n\n1. **PII Governance Report:**\n\
    \   - Total PII columns identified: X\n   - Encrypted: Y (%)\n   - Masked: Z (%)\n\
    \   - Access-controlled: W (%)\n   - Compliance status: GREEN/YELLOW/RED\n\n2.\
    \ **Slack Notifications:**\n   - **PASS:** \"\u2705 PII Governance Check PASSED:\
    \ All 47 PII columns encrypted & access-controlled. Compliance: GDPR \u2713 CCPA\
    \ \u2713 SOC2 \u2713\"\n   - **WARNING:** \"\u26A0\uFE0F PII Governance Issues:\
    \ 3 columns missing encryption, 2 access violations detected. Manual review required.\"\
    \n   - **CRITICAL:** \"\U0001F6A8 CRITICAL PII EXPOSURE: Unencrypted SSN data\
    \ detected in mart_customer_summary. Immediate action required!\"\n\n3. **Audit\
    \ Logging:**\n   - Log all PII checks to compliance_audit_log table\n   - Document\
    \ findings, remediation actions, and approvals\n   - Generate compliance reports\
    \ for auditors\n   - Track PII incidents and resolutions\n\n**DOCUMENTATION:**\n\
    - Generate PII inventory with classification levels\n- Document data lineage for\
    \ each PII column\n- Create compliance mapping (GDPR articles, CCPA sections,\
    \ etc.)\n- Maintain remediation action tracker\n\nReturn: {\n  pii_columns_found:\
    \ count,\n  encrypted_count: count,\n  masked_count: count,\n  access_controlled_count:\
    \ count,\n  compliance_status: 'GREEN'|'YELLOW'|'RED',\n  critical_issues: [],\n\
    \  warnings: [],\n  remediation_applied: [],\n  audit_logged: true,\n  alerts_sent:\
    \ true,\n  pass: true|false\n}"
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 15
  retry_count: 0
