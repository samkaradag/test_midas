- node_id: agent_270ad5d8
  node_type: agent
  label: Query and Format Disputes Report Data
  description: Queries BigQuery for disputes report data and formats it as HTML for
    email
  position:
    x: 800.0
    y: 200.0
  config: {}
  agent_id: data_insights_agent
  agent_instructions: 'Query the BigQuery table ''prd-dagen.payments_v1.ceo_daily_disputes_report''
    using connection ID 8 and extract the following metrics:

    1. Total open disputes count

    2. Total amount at risk (sum of dispute amounts)

    3. Average dispute age in days

    4. Top dispute reasons breakdown (top 5 reasons with counts)

    5. Disputes by aging bucket breakdown (0-30 days, 31-60 days, 61-90 days, 90+
    days)

    6. High-value disputes (>$10k) count and total amount


    Format the output as an HTML email body with professional styling that includes:

    - A header with today''s date

    - Clear sections for each metric

    - Tables for the breakdown data

    - Professional color scheme and formatting

    - Include a summary section at the top with key metrics


    Return the HTML as a string that can be used in an email notification.'
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 15
  retry_count: 0
