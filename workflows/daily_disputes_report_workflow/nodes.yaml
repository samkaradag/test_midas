- node_id: notification_email_0faaf347
  node_type: notification
  label: Failure Alert - Email Notification
  description: Send failure notification email to s@dagen.ai when workflow encounters
    errors
  position:
    x: 1500.0
    y: 200.0
  config:
    channel_type: email
    include_previous_output: true
    message: 'The daily disputes report workflow ({{workflow_name}}) failed at {{timestamp}}.\n\nNode:
      {{node_name}}\nStatus: {{status}}\n\nPlease investigate immediately.\n\nDetails:\n{{previous_output}}'
    recipients: s@dagen.ai
    subject: "\u26A0\uFE0F Daily Disputes Report Workflow FAILED"
    webhook_headers: {}
    webhook_method: POST
    webhook_url: ''
  agent_id: null
  agent_instructions: null
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 5
  retry_count: 0
