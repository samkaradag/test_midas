name: MySQL Random Data Ingestion - Every Minute
description: Discovers all tables in MySQL connection and generates 5 random records
  per table matching the schema, inserts them, and logs insertion counts. Runs every
  minute with resilient error handling.
version: 1.0.0
status: paused
tags:
- mysql
- data-ingestion
- random-data
- recurring
- automation
max_concurrent_runs: 1
timeout_minutes: 60
retry_policy:
  max_retries: 3
  retry_delay: 60
