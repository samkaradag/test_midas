  agent_id: dbt_remediation_agent
  agent_instructions: "Handle DBT transformation failures with diagnostics and recovery:\n\
    1. Identify which models failed from dbt artifacts\n2. Run dbt debug to diagnose\
    \ issues (database connectivity, schema issues)\n3. Attempt incremental refresh:\
    \ dbt run --select state:error\n4. If still failing:\n   - Isolate failed models\
    \ and run individually\n   - Check for circular dependencies or macro issues\n\
    \   - Run dbt deps to refresh dependencies\n5. If recovery unsuccessful:\n   -\
    \ Log detailed error report with manifest information\n   - Create incident ticket\
    \ with failed model list\n   - Notify analytics team\n6. Store failure metadata\
    \ for trend analysis"
