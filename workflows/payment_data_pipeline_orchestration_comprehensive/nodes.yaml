  timeout_minutes: 15
  retry_count: 0
- node_id: agent_3be86c5c
  node_type: agent
  label: 'Stage 5: Performance Optimization Engine'
  description: Advanced performance analysis with optimization recommendations and
    cost analysis
  position:
    x: 6259.0
    y: 120.0
  config: {}
  agent_id: performance_optimizer_agent
  agent_instructions: "Analyze and optimize pipeline performance:\n\n1. DBT MODEL\
    \ ANALYSIS:\n   - Extract execution times from dbt artifacts (run_results.json,\
    \ manifest.json)\n   - Identify slow models (>5 minutes execution time)\n   -\
    \ Calculate model dependencies and critical path\n\n2. MATERIALIZATION RECOMMENDATIONS:\n\
    \   - For models <1min: Consider ephemeral materialization\n   - For models 1-5min:\
    \ Recommend view materialization\n   - For models >5min: Recommend table or incremental\
    \ materialization\n   - Suggest incremental materialization for large fact tables\n\
    \n3. QUERY OPTIMIZATION:\n   - Analyze dbt compiled SQL for expensive operations\n\
    \   - Flag models with:\n     * Expensive joins (multiple joins on non-indexed\
    \ columns)\n     * Heavy aggregations (GROUP BY on high-cardinality columns)\n\
    \     * Lack of partitioning on large tables\n   - Suggest index creation on frequently\
    \ filtered columns\n\n4. BIGQUERY COST ANALYSIS:\n   - Query BigQuery INFORMATION_SCHEMA\
    \ for:\n     * Rows scanned per model\n     * Bytes processed per query\n    \
    \ * Slot usage patterns\n   - Calculate estimated cost (rows_scanned * $0.0025\
    \ per GB)\n   - Identify high-cost models and optimization opportunities\n\n5.\
    \ GENERATE RECOMMENDATIONS:\n   - Create structured optimization report with:\n\
    \     * Model name, execution time, cost\n     * Specific optimization action\
    \ (materialization change, index, partition)\n     * Estimated improvement (%\
    \ reduction in time/cost)\n     * Implementation priority (high/medium/low)\n\n\
    6. TREND ANALYSIS:\n   - Compare with previous runs to identify regressions\n\
    \   - Track optimization impact over time\n   - Log all metrics for dashboard\
    \ consumption"
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 15
  retry_count: 0
