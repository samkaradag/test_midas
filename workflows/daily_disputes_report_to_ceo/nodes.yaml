- node_id: notification_email_7e003c76
  node_type: notification
  label: Alert on Failure
  description: Sends alert email when workflow fails
  position:
    x: 1150.0
    y: 200.0
  config:
    channel_type: email
    include_previous_output: true
    message: 'The daily disputes report workflow failed at {{node_name}}. Please check
      the logs for details.\n\nWorkflow: {{workflow_name}}\nStatus: {{status}}\nTimestamp:
      {{timestamp}}'
    recipients: ceo@dagen.ai
    subject: "\u26A0\uFE0F Daily Disputes Report Workflow Failed"
    webhook_headers: {}
    webhook_method: POST
    webhook_url: ''
  agent_id: null
  agent_instructions: null
  agent_config: {}
  pipeline_id: null
  pipeline_type: null
  timeout_minutes: 5
  retry_count: 0
