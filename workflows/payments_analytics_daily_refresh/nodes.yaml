    \ issues: column name mismatches, schema evolution, test threshold violations\n\
    \n**OUTPUT FORMAT**:\n```\n\u2705 dbt Auto-Fix Complete\n\nError Type: [error\
    \ category]\nRoot Cause: [detailed cause]\n\nFixes Applied:\n- [file1]: [change\
    \ description]\n- [file2]: [change description]\n\nGit Commit: [commit hash]\n\
    Re-run Status: [SUCCESS/FAILED]\n\n[If failed again: Escalation required - human\
    \ review needed]\n```"
